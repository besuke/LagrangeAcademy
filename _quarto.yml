project:
  type: book
  execute-dir: project
  # previous/ holds the earlier drafts (see previous/README.md) and is not rendered
  render:
    - index.qmd
    - ch*.qmd

lang: ja

book:
  title: "Leanから見た金融数学"
  subtitle: "型理論・形式的証明から金融モデルの数値実装へ"
  author: "Eiichi Horigome"
  output-file: "lagrangeAcademy"

  chapters:
    - index.qmd

    - part: "第I部　なぜLeanは数学の定理を証明できるのか"
      chapters:
        - ch01_computation_and_proof.qmd
        - ch02_logic_curry_howard.qmd
        - ch03_dependent_inductive_types.qmd
        - ch04_kernel_and_axioms.qmd
        - ch05_theorem_proving.qmd
        - ch06_structures_typeclasses.qmd
        - ch07_reals_and_floats.qmd
        - ch08_mathlib_probability.qmd
        - ch09_ai_and_formal_proof.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    # chapters are numbered automatically; the preface is not
    number-sections: true

execute:
  eval: true
  echo: true
  warning: false
  message: false
  error: false
