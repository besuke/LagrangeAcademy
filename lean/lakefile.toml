name = "LagrangeAcademy"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LagrangeAcademy"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# not a Mathlib contribution: no Mathlib copyright header is required
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "LagrangeAcademy"
